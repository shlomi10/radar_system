name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: pytest
        run: |
          mkdir -p reports/pytest
          python -m pytest -v --tb=short --junitxml=reports/pytest/junit.xml | tee reports/pytest/output.txt

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure@3.6.2
          allure generate reports/allure-results -o reports/allure-report
          python - <<'PY'
          from pathlib import Path
          index = Path("reports/allure-report/index.html")
          html = index.read_text(encoding="utf-8")
          if "<base " not in html.lower():
              html = html.replace("<head>", '<head>\n    <base href="/radar_system/">', 1)
          index.write_text(html, encoding="utf-8")
          Path("reports/allure-report/404.html").write_text(html, encoding="utf-8")
          PY
          mkdir -p reports/allure-report/data/attachments
          find reports/allure-results -type f \( -name '*.png' -o -name '*attachment*' \) -exec cp -n {} reports/allure-report/data/attachments/ \;

      - name: Radar stream
        if: success() || failure()
        run: python main.py --config config/config.json --stream data/radar_stream.log --output report.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## pytest"
            echo '```'
            if [ -f reports/pytest/output.txt ]; then cat reports/pytest/output.txt; else echo "pytest did not produce a report"; fi
            echo '```'
            echo
            echo "## Allure"
            echo "Live report: https://shlomi10.github.io/radar_system/"
            echo
            echo "## Radar stream validation"
            echo '```'
            if [ -f reports/radar/report.txt ]; then cat reports/radar/report.txt; else echo "radar report was not produced"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports
          path: reports/

      - name: Deploy Allure to GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/allure-report
          force_orphan: true
          enable_jekyll: false

  docker:
    needs: report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Next image number
        id: version
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          user = os.environ.get("DOCKERHUB_USERNAME") or ""
          repo = "radar-system"
          nums = []
          url = (
              f"https://hub.docker.com/v2/repositories/{user}/{repo}/tags?page_size=100"
              if user
              else ""
          )
          while url:
              request = urllib.request.Request(url, headers={"User-Agent": "radar-system-ci"})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as extra:
                  if extra.code == 404:
                      break
                  raise
              for tag in payload.get("results", []):
                  name = tag.get("name") or ""
                  if name.isdigit():
                      nums.append(int(name))
              url = payload.get("next")
          number = max(nums) + 1 if nums else 1
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"number={number}\n")
          print(f"Next image tag: {number}")
          PY

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/radar-system:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/radar-system:${{ steps.version.outputs.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Docker Hub"
            echo "https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/radar-system"
            echo
            echo "This build: \`${{ secrets.DOCKERHUB_USERNAME }}/radar-system:${{ steps.version.outputs.number }}\`"
            echo
            echo '```'
            echo "docker run --rm -p 8765:8765 ${{ secrets.DOCKERHUB_USERNAME }}/radar-system:${{ steps.version.outputs.number }}"
            echo "docker run --rm -p 8765:8765 ${{ secrets.DOCKERHUB_USERNAME }}/radar-system:latest"
            echo "docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/radar-system:latest -m pytest -v"
            echo "docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/radar-system:latest main.py --config config/config.json --stream data/radar_stream.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
